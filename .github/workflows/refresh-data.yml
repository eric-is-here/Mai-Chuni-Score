name: Refresh song data

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: ""

      - name: Regenerate datasets
        run: node .scripts/refresh-data.mjs

      - name: Validate generated files
        run: node .scripts/verify-refresh.mjs

      - name: Push if changed
        run: |
          if git diff --quiet; then
            echo "Dataset is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html maidata.js
          git commit -m "Refresh ArcadeSongs datasets"
          git pull --rebase
          git push
